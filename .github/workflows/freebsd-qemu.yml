name: Build smartmontools on FreeBSD (QEMU)

on:
  workflow_dispatch

jobs:
  build-source-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Provide at least the commit log since last release for 'getversion.sh'.
          # 'git clone --shallow-since=2025-04-29' would be sufficient but this is
          # not supported by 'actions/checkout@v6'.
          fetch-depth: 800
          # Include (future) release tags for 'getversion.sh'
          fetch-tags: true

      - name: Build
        run: |
          version_sh=$(src/getversion.sh -s) && eval "${version_sh}" &&
          ./autogen.sh && mkdir build && cd build &&
          ../configure SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          make dist &&
          mv -v "smartmontools-${SMARTMONTOOLS_PKG_VER}.tar.gz" \
                "smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz" &&
          tar -tvf "smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-src
          path: build/smartmontools-*.tar.gz
          retention-days: 90

  build-freebsd-qemu:
    needs: build-source-tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smartmontools-src

      - name: Build (QEMU)
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true # use 'sh' instead of 'tcsh'
          run: | # SOURCE_DATE_EPOCH not used because GNU tar is not installed by default
            uname -a && fbver=$(uname -r) && fbver=${fbver%%.*} &&
            distfile=$(ls -d smartmontools-*.tar.gz) &&
            test "$(echo "$distfile" | wc -l | tr -d ' ')" = 1 &&
            tar -xf "$distfile" && distdir=${distfile%-*-g*.tar.gz} &&
            version_sh=$("$distdir/src/getversion.sh" -s) && eval "${version_sh}" &&
            cd smartmontools-${SMARTMONTOOLS_PKG_VER} && mkdir build && cd build &&
            ../configure --with-build-info='(GHA/freebsd-qemu)' &&
            make -j4 && make check &&
            bin_distfile="../../smartmontools-freebsd-$fbver-qemu-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz" &&
            make bin_distfile="$bin_distfile" bin-dist && tar -tvf "$bin_distfile"
            tar -xf "$bin_distfile" usr/local/sbin/smartctl
            echo '$' usr/local/sbin/smartctl --scan
            usr/local/sbin/smartctl --scan || echo "::error::'smartctl --scan' failed"

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-freebsd-qemu
          path: smartmontools-freebsd-*.tar.gz
          retention-days: 90
