name: Build and publish on demand

on:
  workflow_dispatch:
    inputs:
      builds-1:
        description: >-
          Default CI builds:
          ubuntu-x86_64-static ubuntu-i686-static
          darwin freebsd windows cygwin
        default: ''
        type: string
      builds-2:
        description: >-
          Extra builds:
          ubuntu-(x86_64|i686|arm64)[-clang][-static]
          (debian|fedora)-(x86_64|arm64)[-static]
          (free|net|open)bsd-x86_64 (omnios|solaris)-x86_64
          windows-(signed|x86_64[-clang]|i686|arm64-clang)
          os2emx
        default: ''
        type: string
      builds-3:
        description: >-
          Emulated builds:
          ubuntu-(ppc64le|riscv64|s390x)
          freebsd-(arm64|powerpc64|riscv64)
          (net|open)bsd-(arm64|riscv64|sparc64)
        default: ''
        type: string
      configure-override:
        description: >-
          Override 'configure' options
        default: ''
        type: string
      make-override:
        description: >-
          Override 'make' options
        default: ''
        type: string
      run-checks:
        description: >-
          Run checks if cross-compiling
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      timeout-override:
        description: >-
          Override timeout (minutes)
        default: null
        type: number
      upload-all:
        description: >-
          Upload 'smartmontools-all' with all builds
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      publish:
        description: >-
          Publish in repository 'smartmontools-builds'
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      builds: >-
        ${{ inputs.builds-1 }} ${{ inputs.builds-2 }} ${{ inputs.builds-3 }}
      configure-override: >-
        ${{ inputs.configure-override }}
      make-override: >-
        ${{ inputs.make-override }}
      run-checks: >-
        ${{ inputs.run-checks }}
      timeout: ${{ fromJSON(inputs.timeout-override || 10) }}
      timeout-qemu: ${{ fromJSON(inputs.timeout-override || 60) }}
      retention-days: ${{ case(inputs.publish == 'yes', 1, 90) }}
    secrets: inherit

  upload-all:
    if: ${{ inputs.upload-all == 'yes' }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          pattern: smartmontools-*
          path: artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-all
          path: artifacts/*
          retention-days: 1

  publish:
    if: ${{ inputs.publish == 'yes' }}
    needs: build
    uses: ./.github/workflows/publish.yml
    secrets: inherit
