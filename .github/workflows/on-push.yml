name: Build and publish on every push

on:
  push:
    branches:
      - main
      - test/build

  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      builds: >-
        ubuntu-x86_64-static ubuntu-i686-static
        darwin freebsd windows cygwin

  publish:
    needs: build
    uses: ./.github/workflows/publish.yml
    secrets: inherit
