name: Build smartmontools (non-release)

on:
  workflow_call:
    inputs:
      builds:
        default: ''
        type: string
      configure-override:
        default: ''
        type: string
      make-override:
        default: ''
        type: string
      retention-days:
        default: 1
        type: number

  workflow_dispatch: # 'smartmontools-src' only

jobs:
  source-tarball:
    runs-on: ubuntu-latest

    steps:
      - name: Show parameters
        run: |
          echo "::notice::builds: '${{ inputs.builds }}'" \
               "configure-override: '${{ inputs.configure-override }}'" \
               "make-override: '${{ inputs.make-override }}'" \
               "retention-days: '${{ inputs.retention-days }}'"

      - uses: actions/checkout@v6
        with:
          # Provide at least the commit log sufficient for 'git-set-mtime.sh'.
          # 'git clone --shallow-since=2011-06-15' would be sufficient but this is
          # not supported by 'actions/checkout@v6'.
          fetch-depth: 3500
          # Include (future) release tags for 'getversion.sh'
          fetch-tags: true

      - name: Build
        run: |
          util/git-set-mtime.sh -f -q &&
          version_sh=$(util/getversion.sh -s) && eval "${version_sh}" &&
          ./autogen.sh --force -v && mkdir build && cd build &&
          ../configure SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          make dist &&
          distfile="../smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz" &&
          mv -v "smartmontools-${SMARTMONTOOLS_PKG_VER}.tar.gz" "$distfile" &&
          tar -tvf "$distfile"

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-src
          path: smartmontools-*.*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  linux-x86_64-static:
    if: ${{ contains(format(' {0} ', inputs.builds), ' linux-x86_64-static ') }}
    needs: source-tarball
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smartmontools-src
          path: source

      - name: Build
        run: |
          tar -xf source/smartmontools-*.*.tar.gz && mv -v smartmontools-*.*/ smartmontools &&
          mkdir smartmontools/build && cd smartmontools/build &&
          version_sh=$(../util/getversion.sh -s) && eval "${version_sh}" &&
          ../configure --with-build-info='(GHA Build)' \
            ${{ inputs.configure-override || '--enable-static-link' }} \
            SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          make ${{ inputs.make-override || '-j V=0' }} && make check &&
          bin_distfile="../../smartmontools-linux-x86_64-static-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz"
          make bin_distfile="$bin_distfile" bin-dist && tar -tvf "$bin_distfile"

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-linux-x86_64-static
          path: smartmontools-linux-x86_64-static-*.*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - run: smartmontools/build/src/smartctl --scan
        continue-on-error: true

  linux-i686-static:
    if: ${{ contains(format(' {0} ', inputs.builds), ' linux-i686-static ') }}
    needs: source-tarball
    runs-on: ubuntu-latest

    steps:
      - name: Install m32 dependencies
        run: sudo apt-get update && sudo apt-get install gcc-multilib g++-multilib

      - uses: actions/download-artifact@v8
        with:
          name: smartmontools-src
          path: source

      - name: Build
        # 'config.guess' from automake 1.16 misdetects 'host=x86_64-pc-linux-gnux32' (x86_64 with x32 ABI).
        # With 'setarch i686 ...' it correctly detects 'host=i686-pc-linux-gnu'.
        # TODO: Remove this workaround if 'ubuntu-latest' provides automake >= 1.17.
        run: |
          tar -xf source/smartmontools-*.*.tar.gz && mv -v smartmontools-*.*/ smartmontools &&
          mkdir smartmontools/build && cd smartmontools/build &&
          version_sh=$(../util/getversion.sh -s) && eval "${version_sh}" &&
          setarch i686 ../configure --with-build-info='(GHA Build)' \
            ${{ inputs.configure-override || '--enable-static-link' }} \
            CC="gcc -m32" CXX="g++ -m32" SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          make ${{ inputs.make-override || '-j V=0' }} && make check &&
          bin_distfile="../../smartmontools-linux-i686-static-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz" &&
          make bin_distfile="$bin_distfile" bin-dist && tar -tvf "$bin_distfile"

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-linux-i686-static
          path: smartmontools-linux-i686-static-*.*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - run: smartmontools/build/src/smartctl --scan
        continue-on-error: true

  darwin:
    # '--enable-static-link' fails due to missing 'crt0.o'
    if: ${{ contains(format(' {0} ', inputs.builds), ' darwin ') }}
    needs: source-tarball
    runs-on: ubuntu-latest
    # we are using clang/osxcross to build it, so running in container
    # see smartmontools/docker-build for the source
    container:
      image: ghcr.io/smartmontools/docker-build:master

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smartmontools-src
          path: source

      - name: Build
        run: |
          export PATH=/usr/osxcross/bin/:$PATH &&
          export LD_LIBRARY_PATH=/usr/osxcross/lib &&
          tar -xf source/smartmontools-*.*.tar.gz && mv -v smartmontools-*.*/ smartmontools &&
          mkdir smartmontools/build && cd smartmontools/build &&
          version_sh=$(../util/getversion.sh -s) && eval "${version_sh}" &&
          ../configure --build=$(../config.guess) --host=x86_64-apple-darwin20.4 \
            --sysconfdir=/private/etc --with-build-info='(GHA Build)' \
            ${{ inputs.configure-override }} \
            'CC=o64-clang' 'CXX=o64-clang++' 'CFLAGS=-arch arm64 -arch x86_64' \
            'CXXFLAGS=-arch arm64 -arch x86_64 -stdlib=libc++' \
            SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          make ${{ inputs.make-override || '-j V=0' }} && make check &&
          dmg_darwin="smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.dmg"
          make pkg_darwin=smartmontools-${SMARTMONTOOLS_GIT_VER_FNAME}.pkg \
            dmg_darwin="$dmg_darwin" install-darwin &&
          mv -v "src/$dmg_darwin" ../..

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-darwin
          path: smartmontools-*.*.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  freebsd:
    if: ${{ contains(format(' {0} ', inputs.builds), ' freebsd ') }}
    needs: source-tarball
    runs-on: ubuntu-latest
    # FreeBSD cross-compilation. We need to check, very possible it would be
    # faster to do everything in normal runner, by installing things locally
    # and using cache
    container:
      image: ghcr.io/smartmontools/docker-build:master

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smartmontools-src
          path: source

      - name: FreeBSD 14 build
        run: |
          tar -xf source/smartmontools-*.*.tar.gz && mv -v smartmontools-*.*/ smartmontools &&
          mkdir smartmontools/build && cd smartmontools/build &&
          version_sh=$(../util/getversion.sh -s) && eval "${version_sh}" &&
          target="-target x86_64-unknown-freebsd14 --sysroot=/opt/cross-freebsd-14/" &&
          target="$target -isystem /opt/cross-freebsd-14/usr/include/c++/v1" &&
          ../configure --build=$(../config.guess) --host=x86_64-pc-freebsd14 \
             --with-build-info='(GHA Build)' \
            ${{ inputs.configure-override || '--enable-static-link' }} \
            CC="clang $target" CXX="clang++ $target" \
            SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          make ${{ inputs.make-override || '-j V=0' }} && make check &&
          bin_distfile="../../smartmontools-freebsd-14-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz"
          make bin_distfile="$bin_distfile" bin-dist && tar -tvf "$bin_distfile"

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-freebsd-14
          path: smartmontools-freebsd-14-*.*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - run: rm -fr smartmontools

      - name: FreeBSD 15 build
        run: |
          tar -xf source/smartmontools-*.*.tar.gz && mv -v smartmontools-*.*/ smartmontools &&
          mkdir smartmontools/build && cd smartmontools/build &&
          version_sh=$(../util/getversion.sh -s) && eval "${version_sh}" &&
          target="-target x86_64-unknown-freebsd15 --sysroot=/opt/cross-freebsd-15/" &&
          target="$target -isystem /opt/cross-freebsd-15/usr/include/c++/v1" &&
          ../configure --build=$(../config.guess) --host=x86_64-pc-freebsd15 \
            --with-build-info='(GHA Build)' \
            ${{ inputs.configure-override || '--enable-static-link' }} \
            CC="clang $target" CXX="clang++ $target" \
            SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          make ${{ inputs.make-override || '-j V=0' }} && make check &&
          bin_distfile="../../smartmontools-freebsd-15-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz"
          make bin_distfile="$bin_distfile" bin-dist && tar -tvf "$bin_distfile"

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-freebsd-15
          path: smartmontools-freebsd-15-*.*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  netbsd-x86_64:
    if: ${{ contains(format(' {0} ', inputs.builds), ' netbsd-x86_64 ') }}
    needs: source-tarball
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smartmontools-src
          path: source

      - name: Build and Run (QEMU)
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          run: | # SOURCE_DATE_EPOCH not used because GNU tar is not installed by default
            uname -a && ver=$(uname -r) && ver=${ver%%.*} &&
            tar -xf source/smartmontools-*.*.tar.gz && mv -v smartmontools-*.*/ smartmontools &&
            mkdir smartmontools/build && cd smartmontools/build &&
            version_sh=$(../util/getversion.sh -s) && eval "${version_sh}" &&
            ../configure --with-build-info='(GHA Build)' \
              ${{ inputs.configure-override }} &&
            make ${{ inputs.make-override || '-j 4 V=0' }} && make check &&
            bin_distfile="../../smartmontools-netbsd-$ver-x86_64-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz" &&
            make bin_distfile="$bin_distfile" bin-dist && tar -tvf "$bin_distfile" &&
            echo '$' smartctl --scan &&
            { src/smartctl --scan || echo "::error::'smartctl --scan' failed"; }

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-netbsd-x86_64
          path: smartmontools-netbsd-*-x86_64-*.*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  openbsd-x86_64:
    if: ${{ contains(format(' {0} ', inputs.builds), ' openbsd-x86_64 ') }}
    needs: source-tarball
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smartmontools-src
          path: source

      - name: Build and Run (QEMU)
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          run: | # SOURCE_DATE_EPOCH not used because GNU tar is not installed by default
            uname -a && ver=$(uname -r) && ver=${ver%%.*} &&
            tar -xzf source/smartmontools-*.*.tar.gz && mv -v smartmontools-*.*/ smartmontools &&
            mkdir smartmontools/build && cd smartmontools/build &&
            version_sh=$(../util/getversion.sh -s) && eval "${version_sh}" &&
            ../configure --with-build-info='(GHA Build)' \
              ${{ inputs.configure-override }} &&
            make ${{ inputs.make-override || '-j 4 V=0' }} && make check &&
            bin_distfile="../../smartmontools-openbsd-$ver-x86_64-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz" &&
            make bin_distfile="$bin_distfile" bin-dist && tar -tvzf "$bin_distfile" &&
            echo '$' smartctl --scan &&
            { src/smartctl --scan || echo "::error::'smartctl --scan' failed"; }

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-openbsd-x86_64
          path: smartmontools-openbsd-*-x86_64-*.*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  omnios-x86_64:
    if: ${{ contains(format(' {0} ', inputs.builds), ' omnios-x86_64 ') }}
    needs: source-tarball
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smartmontools-src
          path: source

      - name: Build and Run (QEMU)
        uses: vmactions/omnios-vm@v1
        with:
          release: "r151054-build" # "r151054" + "pkg install build-essential" (LTS)
          usesh: true
          run: | # SOURCE_DATE_EPOCH not used because GNU tar is not installed by default
            uname -a && ver=$(uname -v) && ver=${ver#*-} && ver=${ver%-*} &&
            tar -xf source/smartmontools-*.*.tar.gz && mv smartmontools-*.*/ smartmontools &&
            mkdir smartmontools/build && cd smartmontools/build &&
            version_sh=$(../util/getversion.sh -s) && eval "${version_sh}" &&
            ../configure --with-build-info='(GHA Build)' \
              ${{ inputs.configure-override }} &&
            make ${{ inputs.make-override || '-j 4 V=0' }} && make check &&
            bin_distfile="../../smartmontools-omnios-$ver-x86_64-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz" &&
            make bin_distfile="$bin_distfile" bin-dist && tar -tvf "$bin_distfile" &&
            tar -xf "$bin_distfile" usr/local/sbin/smartctl &&
            echo '$' smartctl --scan &&
            { src/smartctl --scan || echo "::error::'smartctl --scan' failed"; }

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-omnios-x86_64
          path: smartmontools-omnios-*-x86_64-*.*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  windows:
    if: ${{ contains(format(' {0} ', inputs.builds), ' windows ') }}
    needs: source-tarball
    runs-on: ubuntu-latest

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 g++-mingw-w64-i686 \
            dos2unix groff man2html-base nsis

      - uses: actions/download-artifact@v8
        with:
          name: smartmontools-src
          path: source

      - name: Build
        run: |
          tar -xf source/smartmontools-*.*.tar.gz && mv -v smartmontools-*.*/ smartmontools &&
          mkdir smartmontools/build && cd smartmontools/build &&
          version_sh=$(../util/getversion.sh -s) && eval "${version_sh}" &&
          ../configure --build=$(../config.guess) --host=i686-w64-mingw32 \
            --with-build-info='(GHA Build)' --enable-static-link \
            SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          make ${{ inputs.make-override || '-j V=0' }} && make check && make distdir-win32 &&
          cd .. && mkdir build64 && cd build64 &&
          ../configure --build=$(../config.guess) --host=x86_64-w64-mingw32 \
            --with-build-info='(GHA Build)' \
            ${{ inputs.configure-override || '--enable-static-link' }} \
            SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          make ${{ inputs.make-override || '-j V=0' }} && make check && make distdir-win32 &&
          cd ../build &&
          make builddir_win64=../../build64/src \
            distinst_win32="../../../smartmontools-win32-setup-${SMARTMONTOOLS_GIT_VER_FNAME}.exe" \
            installer-win32

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-windows
          path: smartmontools-win32-setup-*.*.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  cygwin:
    if: ${{ contains(format(' {0} ', inputs.builds), ' cygwin ') }}
    needs: source-tarball
    runs-on: ubuntu-latest
    # Cross build on Fedora is faster than the native build done by 'cygwin.yml'.
    # The recipes below are partly borrowed from Cygwin's own CI build
    container: fedora:latest

    steps:
      - name: Install cross-cygwin toolchain
        run: |
          dnf install -y make
          dnf install -y dnf-plugins-core
          dnf copr enable -y yselkowitz/cygwin
          dnf install -y cygwin64-gcc-c++

      - uses: actions/download-artifact@v8
        with:
          name: smartmontools-src
          path: source

      - name: Build
        run: |
          tar -xf source/smartmontools-*.*.tar.gz && mv -v smartmontools-*.*/ smartmontools &&
          mkdir smartmontools/build && cd smartmontools/build &&
          version_sh=$(../util/getversion.sh -s) && eval "${version_sh}" &&
          ../configure --build=$(../config.guess) --host=x86_64-pc-cygwin \
            --with-build-info='(GHA Build)' \
            ${{ inputs.configure-override }} \
            SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          make ${{ inputs.make-override || '-j V=0' }} && make check &&
          bin_distfile="../../smartmontools-cygwin-${SMARTMONTOOLS_GIT_VER_FNAME}.tar.gz" &&
          make bin_distfile="$bin_distfile" bin-dist && tar -tvf "$bin_distfile"

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-cygwin
          path: smartmontools-cygwin-*.*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  os2emx:
    # '--enable-shared' fails due to syntax error in generated 'smartmon.def'
    # '--enable-static-link' fails due to missing static libraries
    if: ${{ contains(format(' {0} ', inputs.builds), ' os2emx ') }}
    needs: source-tarball
    runs-on: ubuntu-26.04 # cross-os2emx requires glibc-2.43 (TODO: change to 'ubuntu-latest')

    steps:
      - name: Install cross-os2emx toolchain
        run: |
          set -e -o pipefail
          sudo mkdir -pv /opt
          curl -L https://github.com/komh/cross-os2emx/releases/download/1.4.0/cross-os2emx-1.4.0-linux-x64.tar.gz \
          | sudo tar -xzf - -C /opt
          sudo mv -v /opt/cross-os2emx-*/opt/os2emx /opt
          /opt/os2emx/bin/i686-pc-os2-emx-g++ --version

      - uses: actions/download-artifact@v8
        with:
          name: smartmontools-src
          path: source

      - name: Build
        run: |
          export PATH="/opt/os2emx/bin:$PATH" &&
          tar -xf source/smartmontools-*.*.tar.gz && mv -v smartmontools-*.*/ smartmontools &&
          mkdir smartmontools/build && cd smartmontools/build &&
          version_sh=$(../util/getversion.sh -s) && eval "${version_sh}" &&
          ../configure --build=$(../config.guess) --host=i686-pc-os2-emx \
            --with-build-info='(GHA Build)' \
            ${{ inputs.configure-override }} \
            SOURCE_DATE_EPOCH=$((SMARTMONTOOLS_GIT_REV_EPOCH + 1)) &&
          make ${{ inputs.make-override || '-j V=0' }} && make check &&
          bin_distdir="../../smartmontools-os2emx-${SMARTMONTOOLS_GIT_VER_FNAME}" &&
          mkdir -v "$bin_distdir" && mv -v src/smart*.exe src/examples/*.exe "$bin_distdir"

      - uses: actions/upload-artifact@v7
        with:
          name: smartmontools-os2emx
          path: smartmontools-os2emx-*
          compression-level: 9
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
